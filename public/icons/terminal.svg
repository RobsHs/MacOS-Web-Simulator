<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="termGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="termShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="termSquircle">
      <rect x="32" y="32" width="448" height="448" rx="100" ry="100"/>
    </clipPath>
  </defs>
  <!-- Drop Shadow & Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#termBg)" filter="url(#termShadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#termBg)"/>
  <rect x="33" y="33" width="446" height="446" rx="99" ry="99" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Terminal Content inside -->
  <g clip-path="url(#termSquircle)">
    <rect x="32" y="32" width="448" height="220" fill="url(#termGlass)"/>
    <!-- Chevron > -->
    <path d="M120 160 L230 256 L120 352" fill="none" stroke="#34c759" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cursor Block _ -->
    <rect x="260" y="318" width="130" height="34" rx="6" fill="#f2f2f7"/>
  </g>
</svg>

